# ==============================================================================
# OUTPOST: COUNTRY LIVING — Cross-Platform Desktop Build Configuration
# Supports:
#   1. Multi-OS Tauri / Electron CI-CD Matrix (Windows .exe/.msi, macOS .dmg, Linux .AppImage/.deb)
#   2. Electron-Builder configuration (`npx electron-builder --config tauri-builder.yml`)
# ==============================================================================

appId: com.outpostliving.malawi.sanctuary
productName: "Outpost Country Living"
copyright: "Copyright © 2026 Outpost: Country Living Malawi Sanctuary Blueprint"

directories:
  output: release-desktop
  buildResources: public

files:
  - dist/**/*
  - public/**/*
  - main.js
  - preload.cjs
  - package.json

extraMetadata:
  main: main.js

# ------------------------------------------------------------------------------
# Platform Target Specifications (Windows, macOS, Linux)
# ------------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: msi
      arch:
        - x64
  icon: public/pwa-512x512.png
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Outpost Country Living"

mac:
  category: public.app-category.reference
  icon: public/pwa-512x512.png
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
        - universal
    - target: zip
      arch:
        - universal
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  category: Education;Science;Geography;
  synopsis: "Adventist Country Living & Outpost Sanctuary Blueprint for Malawi"
  icon: public/pwa-512x512.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"

# ------------------------------------------------------------------------------
# Tauri v2 & Electron Multi-Platform CI/CD Build Matrix Definition
# ------------------------------------------------------------------------------
tauriBuildMatrix:
  beforeBuildCommand: "npm run build"
  frontendDist: "./dist"
  embeddedServerEntry: "./dist/server.cjs"
  targets:
    windows:
      os: windows-latest
      rustTarget: x86_64-pc-windows-msvc
      bundles: ["nsis", "msi"]
    macos:
      os: macos-latest
      rustTarget: universal-apple-darwin
      bundles: ["dmg", "app"]
    linux:
      os: ubuntu-22.04
      rustTarget: x86_64-unknown-linux-gnu
      bundles: ["appimage", "deb"]
      aptDependencies:
        - libwebkit2gtk-4.1-dev
        - libappindicator3-dev
        - librsvg2-dev
        - patchelf
